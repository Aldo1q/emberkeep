<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Emberkeep — Defend the Last Lantern</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b120d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #16241c; cursor: pointer; }
  #help { color: #9db8a4; font-size: 13px; text-align: center; padding: 8px 12px; line-height: 1.5; }
  #help b { color: #ffe9a8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="help">
    <b>Emberkeep</b> — click a glowing pad to build a tower, then press <b>Space</b> to start a wave.
    Keys: <b>Space</b> start wave · <b>P</b>/<b>Esc</b> pause · <b>R</b> restart · <b>1–4</b> build ·
    <b>F</b> speed · <b>M</b> mute. Clear all 12 waves to keep the Last Lantern lit.
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
